x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: 3

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chat}
      MYSQL_USER: ${MYSQL_USER:-chat}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-user}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

  backend:
    image: chat-backend:${RELEASE_TAG:-local}
    build:
      context: ./backend
    restart: unless-stopped
    environment: &backend-environment
      NODE_ENV: production
      APP_ROLE: api
      PORT: 3001
      DATABASE_URL: mysql://${MYSQL_USER:-chat}:${MYSQL_PASSWORD:-change-me-user}@mysql:3306/${MYSQL_DATABASE:-chat}
      REDIS_URL: redis://redis:6379
      REDIS_KEY_PREFIX: "chat:"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-2h}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: ${STORAGE_LOCAL_DIR:-/app/uploads}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-http://localhost/api}
      STORAGE_SIGNING_SECRET: ${STORAGE_SIGNING_SECRET:?STORAGE_SIGNING_SECRET is required}
      STORAGE_SIGNED_URL_TTL_SECONDS: ${STORAGE_SIGNED_URL_TTL_SECONDS:-600}
      QUEUE_PREFIX: ${QUEUE_PREFIX:-contract:}
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      FRONTEND_BASE_URL: ${PUBLIC_ORIGIN:-http://localhost}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MODEL_COST_INPUT_PER_MILLION_TOKENS: ${MODEL_COST_INPUT_PER_MILLION_TOKENS:-0}
      MODEL_COST_OUTPUT_PER_MILLION_TOKENS: ${MODEL_COST_OUTPUT_PER_MILLION_TOKENS:-0}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3001"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3001/api/health >/dev/null || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    image: chat-backend:${RELEASE_TAG:-local}
    restart: unless-stopped
    environment:
      <<: *backend-environment
      APP_ROLE: worker
    command:
      - node
      - dist/worker.js
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    stop_grace_period: 60s
    logging: *default-logging

  frontend:
    image: chat-frontend:${RELEASE_TAG:-local}
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      worker:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1/api/health >/dev/null || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging

volumes:
  mysql_data:
  redis_data:
  uploads:
